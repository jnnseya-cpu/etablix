<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reach — ETABLIX Internal</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#191a1c">
<meta name="apple-mobile-web-app-title" content="ETABLIX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/internal/css/internal.css">
<style>
  .reach { max-width: 1120px; margin: 0 auto; }
  .reach h1 { font-family: "Barlow Condensed", var(--font-head), sans-serif; font-size: 2rem; text-transform: uppercase; margin: 0 0 4px; }
  .reach .sub { color: var(--slate); font-size: 0.92rem; margin: 0 0 26px; max-width: 760px; line-height: 1.6; }
  .verdict { border-left: 4px solid var(--orange); background: rgba(156,122,60,0.08); padding: 14px 18px; border-radius: 6px; margin: 0 0 24px; }
  .verdict b { font-family: var(--font-head); }
  .verdict.state-empty, .verdict.state-spent { border-left-color: #c0392b; background: rgba(192,57,43,0.08); }
  .verdict.state-ok { border-left-color: #2e7d51; background: rgba(46,125,81,0.08); }
  .num-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 0 0 26px; }
  .num { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .num .v { font-family: "Barlow Condensed", var(--font-head), sans-serif; font-size: 2.1rem; line-height: 1; }
  .num .l { font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--slate); font-family: var(--font-head); margin-top: 6px; }
  .num .n { font-size: 0.78rem; color: var(--slate); margin-top: 6px; line-height: 1.45; }
  .num.warn .v { color: #c0392b; }
  .num.good .v { color: #2e7d51; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .reach table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  .reach th, .reach td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .reach th { font-family: var(--font-head); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); }
  .reach td.n, .reach th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .score.bad { color: #c0392b; }
  .score.mid { color: #9c7a3c; }
  .score.good { color: #2e7d51; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin: 10px 0 4px; }
  .bars i { flex: 1 1 0; background: var(--orange); min-height: 1px; border-radius: 2px 2px 0 0; display: block; }
  .bars i.zero { background: var(--line); }
  .fail { color: var(--slate); font-size: 0.8rem; }
  .brief-item { border-bottom: 1px solid var(--line); padding: 10px 0; font-size: 0.86rem; }
  .brief-item b { font-family: var(--font-head); }
  .brief-item span { display: block; color: var(--slate); margin-top: 3px; }
  code.cmd { display: block; background: #211f1c; color: #f4f1ea; padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; margin-top: 8px; overflow-x: auto; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-block">
    <a class="logo" href="/internal/index.html"><img class="logo-mark" src="/img/logo-mark-reverse.svg" alt="ETABLIX"><span class="logo-text">ETABLIX<small>Integrated Site Services</small></span></a>
    <span class="desk-label">REACH</span>
  </div>
  <div class="desk-strap">What the site scores, and who read it</div>
  <div class="user-box">
    <a class="btn-ghost" href="/internal/index.html" style="text-decoration:none;">Control Desk</a>
    <button class="btn-ghost" id="logout">Sign out</button>
  </div>
</header>

<main class="main">
  <div class="reach" id="reach">
    <p class="empty-note">Loading…</p>
  </div>
</main>

<script type="module" src="/internal/js/reach-page.js"></script>
</body>
</html>
