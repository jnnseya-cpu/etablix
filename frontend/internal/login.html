<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login — ETABLIX</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#191a1c">
<meta name="apple-mobile-web-app-title" content="ETABLIX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/internal/css/internal.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <a class="logo" href="/"><img class="logo-mark" src="/img/logo-mark.svg" alt="ETABLIX"><span class="logo-text">ETABLIX<small>Integrated Site Services</small></span></a>
    <div class="topline">Part of <b>Groupe Nseya</b> · Employee access</div>
    <p class="sub"><b>ETABLIX Control Desk</b> — commercial intake. One operating view. Sign in to continue.</p>
    <div class="login-error" id="error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@etablix.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••••••">
      </div>
      <button class="btn-block" type="submit" id="submit">Sign In</button>
    </form>
    <p class="back-link" style="margin-top:14px;">Forgotten your password? Your administrator can reset it.</p>
    <a class="back-link" href="/">← Back to etablix.com</a>
  </div>
</div>

<script type="module" src="/internal/js/login.js"></script>
</body>
</html>
