<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="0.7" stop-color="#141a24"/>
      <stop offset="1" stop-color="#232a35"/>
    </linearGradient>
    <radialGradient id="vflood" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#f5e4bb" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e8cf95" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8cf95" stop-opacity="0"/>
    </radialGradient>
    <g id="vblock">
      <rect x="0" y="-84" width="200" height="84" fill="#0c0f15"/>
      <rect x="0" y="-84" width="200" height="3" fill="#1e2530"/>
      <rect x="0" y="-43" width="200" height="3" fill="#1e2530"/>
      <g fill="#f2c56b">
        <rect x="12" y="-74" width="16" height="12" opacity="0.95"/>
        <rect x="40" y="-74" width="16" height="12" opacity="0.4"/>
        <rect x="68" y="-74" width="16" height="12" opacity="0.85"/>
        <rect x="96" y="-74" width="16" height="12" opacity="0.6"/>
        <rect x="124" y="-74" width="16" height="12" opacity="0.9"/>
        <rect x="152" y="-74" width="16" height="12" opacity="0.3"/>
        <rect x="12" y="-33" width="16" height="12" opacity="0.55"/>
        <rect x="40" y="-33" width="16" height="12" opacity="0.9"/>
        <rect x="68" y="-33" width="16" height="12" opacity="0.35"/>
        <rect x="96" y="-33" width="16" height="12" opacity="0.8"/>
        <rect x="124" y="-33" width="16" height="12" opacity="0.5"/>
        <rect x="176" y="-33" width="14" height="12" opacity="0.85"/>
      </g>
      <rect x="86" y="-20" width="24" height="20" fill="#f7e6bf" opacity="0.9"/>
    </g>
  </defs>
  <rect width="1200" height="700" fill="url(#vsky)"/>
  <!-- stars -->
  <g fill="#dfe6f2" opacity="0.7">
    <circle cx="120" cy="80" r="1.4"/><circle cx="300" cy="140" r="1.1"/><circle cx="520" cy="60" r="1.3"/>
    <circle cx="760" cy="110" r="1.1"/><circle cx="980" cy="70" r="1.4"/><circle cx="1120" cy="150" r="1.1"/>
    <circle cx="640" cy="180" r="1"/><circle cx="200" cy="210" r="1"/>
  </g>
  <!-- moon -->
  <circle cx="1030" cy="120" r="26" fill="#e9e4d2" opacity="0.85"/>
  <circle cx="1040" cy="112" r="24" fill="#0a0d14"/>
  <!-- village rows -->
  <use href="#vblock" transform="translate(80,520) scale(0.8)"/>
  <use href="#vblock" transform="translate(300,520) scale(0.8)"/>
  <use href="#vblock" transform="translate(520,520) scale(0.8)"/>
  <use href="#vblock" transform="translate(140,600)"/>
  <use href="#vblock" transform="translate(400,600)"/>
  <use href="#vblock" transform="translate(660,600)"/>
  <use href="#vblock" transform="translate(920,600)"/>
  <!-- canteen block with big windows -->
  <g transform="translate(760,520) scale(0.8)">
    <rect x="0" y="-100" width="260" height="100" fill="#0c0f15"/>
    <g fill="#f6d789" opacity="0.9">
      <rect x="16" y="-80" width="50" height="40"/>
      <rect x="82" y="-80" width="50" height="40"/>
      <rect x="148" y="-80" width="50" height="40"/>
      <rect x="214" y="-80" width="30" height="40"/>
    </g>
  </g>
  <!-- light masts -->
  <g>
    <path d="M60 600 l0 -150" stroke="#0a0c11" stroke-width="6"/>
    <rect x="44" y="-162" width="32" height="12" fill="#0a0c11" transform="translate(16,612)"/>
    <ellipse cx="60" cy="452" rx="130" ry="170" fill="url(#vflood)"/>
    <path d="M1160 600 l0 -170" stroke="#0a0c11" stroke-width="6"/>
    <ellipse cx="1160" cy="432" rx="140" ry="185" fill="url(#vflood)"/>
  </g>
  <!-- bus -->
  <g transform="translate(1010,586)">
    <rect x="0" y="-34" width="120" height="34" rx="6" fill="#101319"/>
    <g fill="#f2c56b" opacity="0.8">
      <rect x="8" y="-27" width="18" height="12"/><rect x="32" y="-27" width="18" height="12"/>
      <rect x="56" y="-27" width="18" height="12"/><rect x="80" y="-27" width="18" height="12"/>
    </g>
    <circle cx="24" cy="2" r="8" fill="#07080c"/><circle cx="96" cy="2" r="8" fill="#07080c"/>
  </g>
  <!-- fence + ground -->
  <g stroke="#0a0c11" stroke-width="2.5">
    <path d="M0 600 L1200 600" stroke-width="2"/>
    <path d="M20 600 l0 -22 M80 600 l0 -22 M140 600 l0 -22 M200 600 l0 -22 M260 600 l0 -22 M320 600 l0 -22 M380 600 l0 -22 M440 600 l0 -22 M500 600 l0 -22 M560 600 l0 -22 M620 600 l0 -22 M680 600 l0 -22 M740 600 l0 -22 M800 600 l0 -22 M860 600 l0 -22 M920 600 l0 -22 M980 600 l0 -22"/>
  </g>
  <rect x="0" y="598" width="1200" height="102" fill="#07090d"/>
  <radialGradient id="vvig" cx="0.5" cy="0.4" r="0.9">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="700" fill="url(#vvig)"/>
  <linearGradient id="v2split" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e3c5a" stop-opacity="0.12"/>
    <stop offset="0.5" stop-color="#1e3c5a" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#c87830" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#c87830" stop-opacity="0.11"/>
  </linearGradient>
  <radialGradient id="v2vig" cx="0.5" cy="0.42" r="0.9">
    <stop offset="0.58" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
  </radialGradient>
  <rect width="1200" height="700" fill="url(#v2split)"/>
  <rect width="1200" height="700" fill="url(#v2vig)"/>
</svg>
