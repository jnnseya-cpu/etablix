# Render blueprint for ETABLIX — one web service with a persistent disk.
#
# THE ORDER MATTERS, AND IT IS NOT THE OBVIOUS ONE.
#
#   1. New → Blueprint, point at this repository, pick the branch.
#   2. Render prompts for the sync:false values BEFORE it builds. Fill in
#      ETABLIX_ADMIN_EMAIL and ETABLIX_ADMIN_PASSWORD there. They are not
#      optional and they are not "do it afterwards".
#   3. Deploy. Then add the domain under Settings → Custom Domains.
#
# Why: the server REFUSES to start with NODE_ENV=production and no admin
# credentials, because without them the store seeds three demo employee
# accounts whose passwords are in this repository — a public URL that looks
# finished and lets anybody who has read the source sign in as an
# administrator. So a deploy with those two blank does not come up degraded.
# It does not come up at all, and the log says exactly why. That is the
# intended behaviour; it is not a broken build.
#
# The password must be at least 12 characters. It is the only account on a
# new instance.
#
# SMTP is genuinely optional. Without it, enquiries are written to
# outbox.log and nobody is emailed; the site works.

services:
  - type: web
    name: etablix
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: etablix-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
    envVars:
      # Node 22, not "whatever the platform defaults to". The store uses
      # node:sqlite from the standard library, which does not exist before
      # 22.5 — on Node 20 the process dies on its first import with
      # ERR_UNKNOWN_BUILTIN_MODULE and no amount of environment variables
      # fixes it. The Dockerfile has always pinned 22; this file did not,
      # and a blueprint deploy took the platform default.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ETABLIX_TOKEN_SECRET
        generateValue: true            # keeps employee sessions valid across restarts
      - key: ETABLIX_ADMIN_EMAIL
        sync: false                    # your real admin login — set in dashboard
      - key: ETABLIX_ADMIN_PASSWORD
        sync: false                    # strong password — set in dashboard
      - key: ETABLIX_ADMIN_NAME
        sync: false                    # e.g. "Justin Nseya"
      - key: SMTP_HOST
        sync: false                    # e.g. smtp.zoho.eu / smtp.gmail.com
      - key: SMTP_PORT
        sync: false                    # 587 (STARTTLS) or 465 (TLS)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        value: contact@etablix.com
      - key: NOTIFY_FROM
        value: "ETABLIX Website <no-reply@etablix.com>"
