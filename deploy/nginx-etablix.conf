# nginx vhost for ETABLIX on a shared server (other sites already on nginx).
#
#   1. cp deploy/nginx-etablix.conf /etc/nginx/sites-available/etablix.conf
#   2. ln -s /etc/nginx/sites-available/etablix.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. TLS: apt-get install -y certbot python3-certbot-nginx
#      certbot --nginx -d etablix.com -d www.etablix.com
#      (certbot rewrites this vhost for HTTPS + renewal automatically)

server {
    listen 80;
    listen [::]:80;
    server_name etablix.com www.etablix.com;

    # THE PROXY LIMIT HAS TO BE AT LEAST THE APPLICATION'S, or the proxy
    # refuses the request first — with an HTML error page instead of the
    # application's JSON, so the browser shows a broken upload and the app
    # logs nothing. backend/lib/uploads.js allows 25 MB a file and 20 files;
    # this said 60m against an assumed "10 MB each, five per submission",
    # which had not been true for some time.
    client_max_body_size 520m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
