# nginx vhost for ETABLIX on a shared server (other sites already on nginx).
#
#   1. cp deploy/nginx-etablix.conf /etc/nginx/sites-available/etablix.conf
#   2. ln -s /etc/nginx/sites-available/etablix.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. TLS: apt-get install -y certbot python3-certbot-nginx
#      certbot --nginx -d etablix.com -d www.etablix.com
#      (certbot rewrites this vhost for HTTPS + renewal automatically)
#
# TWO SERVER BLOCKS, AND THE SECOND ONE IS THE POINT.
#
# This vhost used to answer on etablix.com AND www.etablix.com, proxying both
# to the application and redirecting neither — while deploy/Caddyfile, the
# alternative in the same directory, sent www to the apex with a 301. So the
# canonical host of the site was a property of whichever proxy the operator
# happened to install, and Search Console reported pages as "Page with
# redirect" without it being possible to say from the repository whether that
# was correct.
#
# The application now normalises www to the apex itself (see
# backend/lib/canonical-url.js), so this is belt and braces. It is here anyway
# because a proxy that serves two hosts is serving the same page at two
# addresses, and that is worth one 301 rather than a canonical tag and hope.

# www exists only to send callers to the apex. Keep it in the certbot -d list
# so the redirect itself is served over TLS.
server {
    listen 80;
    listen [::]:80;
    server_name www.etablix.com;

    return 301 https://etablix.com$request_uri;
}

# The apex: the one canonical host.
server {
    listen 80;
    listen [::]:80;
    server_name etablix.com;

    # THE PROXY LIMIT HAS TO BE AT LEAST THE APPLICATION'S, or the proxy
    # refuses the request first — with an HTML error page instead of the
    # application's JSON, so the browser shows a broken upload and the app
    # logs nothing. backend/lib/uploads.js allows 25 MB a file and 20 files;
    # this said 60m against an assumed "10 MB each, five per submission",
    # which had not been true for some time.
    client_max_body_size 520m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
